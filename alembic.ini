# Alembic config for Liveprofit platform tables.
# NOTE: keep this file ASCII-only; alembic reads it with locale encoding (GBK on Windows).
# sqlalchemy.url is resolved in backend/migrations/env.py from Settings
# (LIVEPROFIT_DATABASE_URL first, PG_* fallback; override via: alembic -x db_url=...).

[alembic]
script_location = backend/migrations
prepend_sys_path = .
path_separator = os

file_template = %%(rev)s_%%(slug)s
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
