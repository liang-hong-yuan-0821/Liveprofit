# Liveprofit frontend Nginx：SPA 静态资源 + /api 反代 + SSE 禁缓冲（§3.1.6 契约）
# proxy_read_timeout 75s > 服务端空闲心跳 30s；禁止 gzip/proxy cache/buffering，保证 Stream 帧逐条到达。

server {
    listen 80;
    server_name _;

    # SSE 专用 location：任务事件流（独立于通用 /api location，避免缓冲/超时默认值）
    location ~ ^/api/v1/analysis-tasks/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        add_header X-Accel-Buffering no always;
    }

    # 通用 API 反代
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    # SPA fallback（frontend 静态构建接入前，根路径 404 属预期）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
