<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>量化策略与实操层 — 表 ER 图</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --page: #f9f9f7;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #898781;
  --edge-fk: #52514e;
  --edge-ref: #898781;
  --g-legacy: #2a78d6;
  --g-new: #eb6834;
  --g-market: #1baf7a;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --ink: #ffffff;
    --ink2: #c3c2b7;
    --muted: #898781;
    --edge-fk: #c3c2b7;
    --edge-ref: #898781;
    --g-legacy: #3987e5;
    --g-new: #d95926;
    --g-market: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19;
  --page: #0d0d0d;
  --ink: #ffffff;
  --ink2: #c3c2b7;
  --muted: #898781;
  --edge-fk: #c3c2b7;
  --edge-ref: #898781;
  --g-legacy: #3987e5;
  --g-new: #d95926;
  --g-market: #199e70;
}
body { margin: 0; background: var(--page); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
svg { display: block; }
.ebox { stroke-width: 1.5; }
.t-h1 { font-size: 16px; font-weight: 600; fill: var(--ink); }
.t-leg, .t-foot { font-size: 10.5px; fill: var(--muted); }
.t-title { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.t-badge { font-size: 9.5px; font-weight: 700; }
.t-col { font-size: 11px; fill: var(--ink); }
.t-type { font-size: 9.5px; fill: var(--muted); }
.t-tag { font-size: 9.5px; fill: var(--ink2); }
.eline { fill: none; stroke-width: 1.5; }
.edge.fk .eline { stroke: var(--edge-fk); }
.edge.ref .eline { stroke: var(--edge-ref); stroke-dasharray: 6 4; }
.ehit { fill: none; stroke: transparent; stroke-width: 10; }
.lbl { font-size: 10.5px; fill: var(--ink2); paint-order: stroke; stroke: var(--surface-1); stroke-width: 3.5px; }
.leg-fk { stroke: var(--edge-fk); stroke-width: 1.5; }
.leg-ref { stroke: var(--edge-ref); stroke-width: 1.5; stroke-dasharray: 6 4; }
.entity { cursor: default; transition: opacity .15s; }
.edge, .lbl { transition: opacity .15s; }
.dim { opacity: .22; }
.edge.hl .eline { stroke: var(--hl-color, var(--edge-fk)); stroke-width: 2.4; }
.edge.hl.ref .eline { stroke-dasharray: 6 4; }
</style>
</head>

<script>
(function () {
  var entities = Array.prototype.slice.call(document.querySelectorAll('.entity'));
  var edges = Array.prototype.slice.call(document.querySelectorAll('.edge'));
  var labels = Array.prototype.slice.call(document.querySelectorAll('.lbl'));
  entities.forEach(function (el) {
    el.addEventListener('mouseenter', function () {
      var id = el.dataset.id;
      var g = getComputedStyle(el.querySelector('.ebox')).stroke;
      var related = {};
      related[id] = true;
      edges.forEach(function (e) {
        if (e.dataset.from === id || e.dataset.to === id) {
          related[e.dataset.from] = true;
          related[e.dataset.to] = true;
          e.classList.add('hl');
          e.style.setProperty('--hl-color', g);
        } else {
          e.classList.add('dim');
        }
      });
      entities.forEach(function (o) { if (!related[o.dataset.id]) o.classList.add('dim'); });
      labels.forEach(function (l) {
        if (!(l.dataset.from === id || l.dataset.to === id)) l.classList.add('dim');
      });
    });
    el.addEventListener('mouseleave', function () {
      entities.forEach(function (o) { o.classList.remove('dim'); });
      edges.forEach(function (e) { e.classList.remove('hl', 'dim'); e.style.removeProperty('--hl-color'); });
      labels.forEach(function (l) { l.classList.remove('dim'); });
    });
  });
})();
</script>
