[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liveprofit"
version = "0.1.0"
description = "LiveProfit - 多智能体股票交易分析系统，基于 LangGraph 编排多个 LLM 智能体协作分析 A 股市场"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # AI/LLM 框架
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",

    # 金融数据源
    "tushare>=1.4.0",
    "baostock>=0.9.4,<0.10",
    "akshare>=1.17.0",
    # 向量数据库
    "chromadb>=0.6.0",

    # 数据处理
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "python-dateutil>=2.9.0",
    "exchange-calendars==4.13.2",

    # 数据库和缓存
    "redis>=6.2.0",

    # 事件研究系统：PostgreSQL 16 + pgvector
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",

    # 事件研究系统：事件研究法 OLS 回归
    "statsmodels>=0.14.0",

    # 事件研究系统：文本向量化（bge-m3）
    "sentence-transformers>=3.0.0",

    # 事件研究系统：REST API
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",

    # 事件研究系统：每日批处理常驻调度（挂 FastAPI lifespan，替代 schtasks 方案 B）
    "apscheduler>=3.10.0",

    # 板块层热力图（自包含 HTML，离线生成）
    "plotly>=5.18.0",

    # 事件研究系统：事件爬虫（requests + BeautifulSoup）
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",

    # 工具
    "python-dotenv>=1.0.0",
]

[project.scripts]
liveprofit = "main:main"
# 平台稳定入口（backend/cli.py）：等价于 uvicorn / dramatiq / python -m backend.workers.dispatcher
liveprofit-api = "backend.cli:api_main"
liveprofit-worker = "backend.cli:worker_main"
liveprofit-dispatcher = "backend.cli:dispatcher_main"
liveprofit-market-worker = "backend.cli:market_worker_main"

# 依赖分组：core = 既有 AI 内核依赖（[project.dependencies]）；
# platform = 平台新增（FastAPI 等已因事件研究在 core 中，此处只列平台独有）；
# test = 平台测试依赖。API/Worker 共用同一锁定版本。
[project.optional-dependencies]
platform = [
    "ruff>=0.16.7",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "dramatiq[redis]>=1.17.0",
    "pydantic-settings>=2.2.0",
    "prometheus-client>=0.20.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["AI*", "backend*", "db*"]
exclude = ["tests*", "docs*", "data*", "logs*", "results*", "chroma_db*", "var*"]

[tool.setuptools.package-data]
"AI.templates" = ["*.md", "market/*.md", "sector/*.md", "stock/*.md"]
"db.instrument" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests/backend", "tests/ai", "tests/data", "tests/e2e"]
addopts = ["--strict-markers"]
markers = [
    "real_llm: real LLM/toolkit/memory; human-only --allow-live opt-in",
    "external_data: real external data source; explicit manual execution",
    "requires_db: isolated PostgreSQL/Redis; --allow-db opt-in",
    "e2e: end-to-end flow; --allow-e2e opt-in",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
