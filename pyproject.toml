[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liveprofit"
version = "0.1.0"
description = "LiveProfit - 多智能体股票交易分析系统，基于 LangGraph 编排多个 LLM 智能体协作分析 A 股市场"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # AI/LLM 框架
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",

    # 金融数据源
    "tushare>=1.4.0",
    "akshare>=1.17.0",
    "stockstats>=0.4.1",

    # 向量数据库
    "chromadb>=0.6.0",

    # 数据处理
    "pandas>=2.2.0",
    "python-dateutil>=2.9.0",

    # 数据库和缓存
    "redis>=6.2.0",

    # 事件研究系统：PostgreSQL 16 + pgvector
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",

    # 事件研究系统：事件研究法 OLS 回归
    "statsmodels>=0.14.0",

    # 事件研究系统：文本向量化（bge-m3）
    "sentence-transformers>=3.0.0",

    # 事件研究系统：REST API + 审核界面
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.40.0",

    # 板块层热力图（自包含 HTML，离线生成）
    "plotly>=5.18.0",

    # 事件研究系统：事件爬虫（requests + BeautifulSoup）
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",

    # 工具
    "python-dotenv>=1.0.0",
]

[project.scripts]
liveprofit = "main:main"

[tool.setuptools.packages.find]
include = ["AI*"]
exclude = ["tests*", "docs*", "data*", "logs*", "results*", "chroma_db*"]

[tool.setuptools.package-data]
"AI.templates" = ["*.md", "market/*.md", "sector/*.md", "stock/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
